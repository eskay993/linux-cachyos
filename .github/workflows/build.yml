name: build-kernel

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
            docker run --rm --entrypoint bash \
            -e GH_TOKEN -e GPG_PRIVATE_KEY -e FORCE -e GITHUB_REPOSITORY \
            -v "$PWD:/work" -w /work \
            cachyos/docker-makepkg /work/build.sh
